name: AgentPetIOS
options:
  bundleIdPrefix: local.chenmingxin
  deploymentTarget:
    iOS: "17.0"
targets:
  AgentPetIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/AgentPetIOS
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 小鑫
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "1"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 用于连接同一局域网内 Mac 上运行的小鑫桌面端服务。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.chenmingxin.AgentPetIOS
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  AgentPetIOS:
    build:
      targets:
        AgentPetIOS: all
    run:
      config: Debug
