<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>小鑫 · Agent Pet</title><link rel="stylesheet" href="./ui.css"></head>
<body><main id="pet">
  <button id="character" type="button" aria-label="小鑫：点击展开或收起通知，拖动移动，右键打开菜单">
    <video id="animation" muted autoplay loop playsinline aria-label="小鑫"></video>
    <span id="activity-badge" hidden>1</span>
  </button>
  <section id="panel" aria-label="小鑫消息通知">
    <div id="first-awake" class="glass-card" hidden>
      <span class="awake-title">Hi, I'm 小鑫</span>
      <span class="awake-body">我会实时汇聚本机各 AI Agent 的任务通知，点击蓝色小女仆即可展开或收起，点击卡片直接回到原会话。</span>
      <button id="awake-dismiss" type="button">知道了</button>
    </div>
    <button id="activity-stack" type="button" hidden aria-expanded="false"></button>
    <div id="activity-list" role="list" aria-label="最近的 Agent 活动"><p id="empty" role="status">暂无需要关注的活动</p></div>
    <p id="feedback" role="status" aria-live="polite"><span id="feedback-text"></span><button id="feedback-retry" type="button" hidden>重试</button><button id="feedback-close" type="button" aria-label="关闭提示" hidden>×</button></p>
  </section>
</main><script type="module" src="./ui.js"></script></body></html>
