<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'" />
  <title>小鑫 · AI Agent 管理</title>
  <link rel="stylesheet" href="./manager.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="title-group">
        <h1>AI Agent 接入管理</h1>
        <p class="subtitle">新装默认仅连接 DSH；点击 <kbd>+</kbd> 为本机已安装的 AI Agent 写入只读观察配置（自动备份原配置）。</p>
      </div>
      <div class="header-actions">
        <button id="enable-all-btn" class="action-btn primary" type="button">一键接入已安装</button>
        <button id="rescan-btn" class="ghost-btn" type="button">重新扫描</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main class="sections">
      <section class="group">
        <div class="group-header">
          <h2>已启用</h2>
          <span id="enabled-count" class="count-pill">0</span>
        </div>
        <div id="enabled-list" class="card-list"></div>
      </section>

      <section class="group">
        <div class="group-header">
          <h2>本机已检测到（可一键接入）</h2>
          <span id="detected-count" class="count-pill">0</span>
        </div>
        <div id="detected-list" class="card-list"></div>
        <div id="detected-empty" class="empty-note" hidden>本机暂未发现其他尚未接入的 AI Agent。</div>
      </section>

      <section class="group">
        <div class="group-header">
          <h2>其他支持的工具（未检测到）</h2>
          <span id="missing-count" class="count-pill">0</span>
        </div>
        <div id="missing-list" class="card-list compact"></div>
      </section>
    </main>

    <footer class="footnote">
      仅读取会话与工具生命周期元数据，不读取或保存提示词、工具参数及模型输出。
    </footer>
  </div>
  <script type="module" src="./manager.js"></script>
</body>
</html>
