<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>小鑫 · AI Agent 管理</title>
<link rel="stylesheet" href="manager.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="title-group">
        <h1>小鑫 · AI Agent 管理</h1>
        <p class="subtitle">自动检测本机 AI Agent 的运行状态、桌面通知提醒与一键回跳原会话。</p>
      </div>
      <div class="header-actions">
        <label class="toggle-pill" for="autostart-toggle" title="登录 macOS 时自动启动小鑫">
          <input id="autostart-toggle" type="checkbox">
          <span>开机自动启动</span>
        </label>
        <button id="enable-all-btn" class="action-btn primary" type="button">一键接入已安装</button>
        <button id="rescan-btn" class="ghost-btn" type="button">重新扫描</button>
      </div>
    </header>

    <div class="panel-toolbar">
      <p class="toolbar-note">对支持原生 Hook 的 CLI 会自动写入监听脚本，其余客户端会自动同步会话状态与项目目录。</p>
    </div>

    <div id="banner" class="banner" hidden></div>

    <main class="sections">
      <section>
        <div class="group-header">
          <h2>已接入</h2>
          <span id="enabled-count" class="count-pill">0</span>
        </div>
        <div id="enabled-list" class="card-list"></div>
      </section>

      <section>
        <div class="group-header">
          <h2>本机已检测到，可一键接入</h2>
          <span id="detected-count" class="count-pill">0</span>
        </div>
        <div id="detected-list" class="card-list"></div>
        <div id="detected-empty" class="empty-note" hidden>本机检测到的 AI Agent 均已接入。</div>
      </section>

      <section>
        <div class="group-header">
          <h2>未检测到或尚未安装</h2>
          <span id="missing-count" class="count-pill">0</span>
        </div>
        <div id="missing-list" class="card-list"></div>
      </section>
    </main>
  </div>

  <script src="manager.js"></script>
</body>
</html>
